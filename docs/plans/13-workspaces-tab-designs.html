<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Dashboard Workspaces tab (round 2: 6 options)</title>
<!--
  PROTOTYPE, throwaway. Question: what should the dashboard's Workspaces tab (today the "Coming soon"
  placeholder in DashboardCenter) look like, given the card has no fixed size?
  Round 2: round 1 (five variants) narrowed to the Overview grid (1) and Monitor lanes (2); the
  scratchpad is gone. Six options inside a mock of DashboardCenter, switchable with
  ?variant=1a|1b|1c|2a|2b|2c (or ← / → when no field is focused).
    1a one row per monitor (tiles shrink, never wrap)    2a empty columns full width, dashed
    1b current workspace large (2×2, dense packing)      2b only occupied columns, empties as header chips
    1c occupied only, empties as header chips            2c one row per workspace, windows flow sideways
  Card size is a knob, not a constant: ?w= (card width), ?h= (max height), ?hmode=fit|fixed, plus the
  bottom-right drag handle and the size presets. Every variant reflows with container queries on the
  card body, so judge each one at 560, 720, 1000 and 1280 wide, and at short and tall heights.
  The data knobs (?mons=1..3, ?ws=1..10 per monitor, ?density=light|normal|heavy) mirror
  MonitorService.workspacesPerMonitor and the per-monitor contiguous workspace blocks.
  Actions are stubs: they mutate in-memory state and log the hyprctl dispatch they stand for.
  Colors map omarchy palette roles onto config/Colors.qml tokens; app hues use Colors.appColor()'s hash.
-->
<style>
:root{--ui:"Geist","Inter",system-ui,sans-serif;--mono:"Iosevka","GeistMono Nerd Font","JetBrains Mono",ui-monospace,monospace;--rp:9px;--rc:6px;--jr:16px;--cw:720px;--maxh:600px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--ui);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--surface) transparent}

/* ---------- desktop mock ---------- */
#desk{position:fixed;inset:0;background:
  radial-gradient(1100px 700px at 78% 88%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 62%),
  radial-gradient(900px 600px at 8% 18%,color-mix(in srgb,var(--purple) 18%,transparent),transparent 60%),
  linear-gradient(160deg,var(--bg2),var(--bg))}
.win{position:absolute;top:44px;bottom:12px;background:var(--bg);border:2px solid var(--surface);border-radius:8px;overflow:hidden;opacity:.9}
.win.active{border-color:var(--accent)}
.win .tb{height:30px;display:flex;align-items:center;padding:0 10px;background:var(--bg2);font-size:12px;color:var(--subtle)}
.win .blk{margin:16px;height:14px;border-radius:4px;background:var(--surface)}
#bar{position:fixed;top:4px;left:10px;right:10px;height:28px;background:var(--bg);border-radius:var(--rp);display:flex;align-items:center;gap:4px;padding:0 6px;font-family:var(--mono);font-size:13px;z-index:40}
.mod{height:22px;padding:0 8px;border-radius:5px;display:flex;align-items:center;gap:6px;color:var(--text)}
.wss{display:flex;gap:2px}
.bws{min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;border-radius:5px;color:var(--faint)}
.bws.occ{color:var(--subtle)}.bws.cur{color:var(--accent);background:var(--accentDim)}
.hair{width:1px;height:12px;background:var(--surface);margin:0 4px}
#title{position:absolute;left:50%;transform:translateX(-50%);max-width:40%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- dashboard card ---------- */
#dash{position:fixed;top:31px;left:calc(50% - var(--cw) / 2);width:var(--cw);padding:12px;display:flex;flex-direction:column;gap:8px;z-index:30;
  background:var(--bg);border:1px solid var(--surface);border-top:0;border-radius:0 0 var(--rp) var(--rp);box-shadow:0 18px 40px rgba(0,0,0,.28)}
#dash::before,#dash::after{content:"";position:absolute;top:0;width:var(--jr);height:var(--jr);pointer-events:none}
#dash::before{left:calc(-1 * var(--jr));background:radial-gradient(circle at 0 100%,transparent calc(var(--jr) - 1px),var(--surface) calc(var(--jr) - 1px),var(--surface) var(--jr),var(--bg) var(--jr))}
#dash::after{right:calc(-1 * var(--jr));background:radial-gradient(circle at 100% 100%,transparent calc(var(--jr) - 1px),var(--surface) calc(var(--jr) - 1px),var(--surface) var(--jr),var(--bg) var(--jr))}
.dhead{display:flex;align-items:center;gap:8px;flex:none}
.tabs{flex:1;display:flex;gap:8px;min-width:0}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--subtle);font-size:14px;padding-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab i{display:block;width:100%;height:2px;border-radius:1px;background:transparent}
.tab.on{color:var(--text);font-weight:600}.tab.on i{background:var(--accent)}
.gear{width:28px;height:28px;border-radius:var(--rc);display:grid;place-items:center;color:var(--subtle);font-size:16px}
#body{container:wsbody/inline-size;display:flex;flex-direction:column;min-height:0;max-height:calc(var(--maxh) - 64px)}
#dash.fixed #body{height:calc(var(--maxh) - 64px)}
#body>*{flex:1 1 auto;min-height:0}
#grip{position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;border-radius:50%;background:#fafafa;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:nwse-resize;z-index:5;display:grid;place-items:center;color:#111;font:11px system-ui}
#sizeTag{position:absolute;right:16px;bottom:-24px;font:11px ui-monospace,monospace;color:#fafafa;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:4px;pointer-events:none}

/* ---------- shared primitives ---------- */
.ic{display:inline-grid;place-items:center;flex:none;border-radius:24%;font-weight:600;letter-spacing:-.02em;background:hsl(var(--h) 65% 72%);color:rgba(0,0,0,.6)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subtle)}
.sec .ln{flex:1;height:1px;background:var(--surface)}
.sec .n{color:var(--faint);text-transform:none;letter-spacing:0;font-family:var(--mono)}
.ib{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--subtle);font-size:12px;flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.on{color:var(--accent)}
.ib.kill:hover{color:var(--danger)}
.btn{height:28px;padding:0 10px;border-radius:var(--rc);border:1px solid var(--surface);background:var(--bg2);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-weight:600}
.urg{width:6px;height:6px;border-radius:50%;background:var(--danger);display:inline-block;flex:none}
.tag{font-size:10.5px;font-family:var(--mono);padding:0 5px;line-height:16px;border-radius:4px;border:1px solid var(--surface);color:var(--subtle);white-space:nowrap}
.tag.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accentDim)!important}
[draggable=true]{cursor:grab}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* minimap (variants 1 and 3) */
.mini{position:relative;aspect-ratio:var(--ar);background:var(--bg2);border:1px solid var(--surface);border-radius:var(--rc);overflow:hidden;transition:border-color .14s}
.mini:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.mini.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mini.vis:not(.cur){border-color:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.mini .w{position:absolute;border-radius:3px;background:color-mix(in srgb,hsl(var(--h) 60% 65%) 22%,var(--bg));border:1px solid color-mix(in srgb,hsl(var(--h) 60% 65%) 55%,var(--bg));display:grid;place-items:center;overflow:hidden;transition:border-color .14s}
.mini .w:hover{border-color:var(--text)}
.mini .w.foc{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mini .w.fl{box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:2}
.mini .w.fs{z-index:3}
.mini .w .urg{position:absolute;top:3px;right:3px}
.mini .w .wt{position:absolute;left:4px;right:4px;bottom:2px;font-size:10px;color:var(--text);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.mini .plus{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:18px}
.mini.empty{border-style:dashed;background:transparent}

/* ---------- 1 · Overview (shared) ---------- */
.v1{display:flex;flex-direction:column;gap:12px;padding-right:4px}
.v1 .cell{display:flex;flex-direction:column;gap:5px;min-width:0;container-type:inline-size}
.v1 .cap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--subtle);min-width:0}
.v1 .cap .num{color:var(--text);font-weight:600}
.v1 .cap.cur .num{color:var(--accent)}
.v1 .cap .ell{flex:1}
@container (width < 100px){.v1 .cap .ell{display:none}.v1 .cap{justify-content:center}}
@container (width < 70px){.mini .w .ic{display:none}}
.v1 .status{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--subtle);background:var(--bg);border-top:1px solid var(--surface);padding:7px 2px 0;min-height:28px}
.empties{display:flex;gap:4px;align-items:center;text-transform:none;letter-spacing:0;font-size:11px;color:var(--faint)}
.ep{min-width:24px;height:20px;padding:0 6px;border-radius:4px;border:1px dashed var(--surface);font-family:var(--mono);font-size:11px;color:var(--subtle)}
.ep:hover{border-color:var(--accent);color:var(--accent)}
.none{font-size:12px;color:var(--faint);padding:14px;border:1px dashed var(--surface);border-radius:var(--rc);text-align:center}

/* 1A · one row per monitor: tiles shrink, never wrap */
.v1a .row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}

/* 1B · current workspace large: it spans 2×2 and dense flow packs the rest around it */
.v1b .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tmin,132px),1fr));grid-auto-flow:dense;gap:10px 8px;align-items:start}
.v1b .hero{grid-column:span 2;grid-row:span 2}
.v1b .hero .cap{font-size:13px}
@container wsbody (width < 560px){.v1b .grid{--tmin:100px}}
@container wsbody (width > 980px){.v1b .grid{--tmin:168px}}

/* 1C · occupied only: one row when they fit, empties become chips in the monitor header */
.v1c .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(var(--tmin,148px),(100% - (var(--n) - 1) * 8px) / var(--n)),1fr));gap:10px 8px}
@container wsbody (width < 560px){.v1c .grid{--tmin:120px}}

/* ---------- 2 · Lanes (shared) ---------- */
.v2{display:flex;flex-direction:column;gap:12px;padding-right:4px}
.lane{display:flex;flex-direction:column;gap:6px;min-width:0}
.cols{display:flex;gap:6px;min-width:0}
.col{flex:1 1 0;min-width:0;background:var(--bg2);border:1px solid var(--surface);border-radius:var(--rc);padding:5px;display:flex;flex-direction:column;gap:2px;transition:border-color .14s}
.col.cur{border-color:var(--accent)}
.col.vis:not(.cur){border-color:color-mix(in srgb,var(--accent) 40%,var(--surface))}
.col .ch{display:flex;align-items:center;gap:6px;padding:2px 4px 5px;font-size:11px;color:var(--subtle)}
.col .ch .num{font-size:15px;font-weight:650;color:var(--text)}
.col.cur .ch .num{color:var(--accent)}
.col .ch:hover .num{text-decoration:underline}
.chip{display:flex;align-items:center;gap:7px;height:30px;padding:0 6px;border-radius:5px;font-size:12.5px;min-width:0}
.chip:hover{background:var(--hover)}
.chip.foc{background:var(--sel)}
.chip .t{flex:1;display:flex;flex-direction:column;min-width:0;line-height:1.15}
.chip .t small{font-size:10.5px;color:var(--subtle)}
.chip .x{display:none}.chip:hover .x{display:grid}
.chip .fl{font-size:10px;color:var(--subtle)}
.void{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px;color:var(--faint);font-size:12px}
.void .btn{height:24px;font-size:11.5px;opacity:0;transition:opacity .14s}
.col:hover .void .btn,.wsr:hover .void .btn{opacity:1}
@container wsbody (width < 600px){.v2a .cols,.v2b .cols{flex-wrap:wrap}.v2a .col,.v2b .col{flex:1 1 calc(50% - 3px)}}
@container wsbody (width > 1000px){.chip{height:34px}.chip .t small{font-size:11px}}

/* 2A · empty columns keep full width, dashed, with a launch affordance on hover */
.v2a .col.empty{background:transparent;border-style:dashed}
.v2a .col.empty .ch .num{color:var(--faint)}

/* 2B · only occupied columns; empties are chips in the lane header */

/* 2C · one row per workspace, windows flow left to right */
.v2c .rows{display:flex;flex-direction:column;gap:4px}
@container wsbody (width > 960px){.v2c .rows{display:grid;grid-template-columns:1fr 1fr;align-items:start}}
.wsr{display:grid;grid-template-columns:32px minmax(0,1fr);align-items:start;gap:6px;padding:4px;border:1px solid var(--surface);border-radius:var(--rc);background:var(--bg2);transition:border-color .14s}
.wsr.cur{border-color:var(--accent)}
.wsr.vis:not(.cur){border-color:color-mix(in srgb,var(--accent) 40%,var(--surface))}
.wsr .num{height:30px;border-radius:5px;font-size:15px;font-weight:650;color:var(--text)}
.wsr .num:hover{background:var(--hover)}
.wsr.cur .num{color:var(--accent)}
.wsr .flow{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.wsr .chip{flex:0 1 auto;max-width:250px;background:var(--bg)}
.wsr .chip.foc{background:var(--sel)}
.wsr.empty{background:transparent;border-style:dashed}
.wsr.empty .num{color:var(--faint)}
.wsr .void{flex-direction:row;justify-content:flex-start;min-height:30px;padding-left:4px}
.wsr .void .btn{height:22px;font-size:11px}


/* ---------- toast + prototype chrome (deliberately NOT themed) ---------- */
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:55;padding:8px 14px;background:var(--bg);border:1px solid var(--surface);border-radius:var(--rp);font:12px var(--mono);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .18s,transform .18s;pointer-events:none}
#toast.hide{opacity:0;transform:translate(-50%,8px)}
#switch{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:6px;padding:5px;background:#fafafa;color:#111;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.45);font:12.5px/1 system-ui,sans-serif}
#switch button{width:30px;height:30px;border-radius:50%;font-size:16px;color:#111;cursor:pointer}
#switch button:hover{background:#e6e6e6}
#switch .lab{min-width:210px;text-align:center;font-weight:650}
#switch select{font:inherit;border:1px solid #ccc;border-radius:999px;padding:5px 8px;background:#fff;color:#111}
#switch .div{width:1px;height:20px;background:#ddd}
#knobs{position:fixed;left:12px;bottom:14px;z-index:90;width:250px;background:rgba(10,10,10,.88);color:#ddd;border-radius:10px;font:11.5px/1.4 system-ui,sans-serif;padding:9px 11px;box-shadow:0 6px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:7px}
#knobs h4,#state h4{margin:0;font:600 10px system-ui;letter-spacing:.1em;color:#999}
#knobs label{display:flex;align-items:center;gap:8px}
#knobs label span{width:70px;color:#aaa}
#knobs input[type=range]{flex:1;accent-color:#fafafa}
#knobs select{flex:1;font:inherit;background:#222;color:#eee;border:1px solid #444;border-radius:5px;padding:2px 4px}
#knobs .pre{display:flex;gap:4px;flex-wrap:wrap}
#knobs .pre button{font:inherit;font-size:10.5px;color:#eee;background:#2a2a2a;border:1px solid #444;border-radius:5px;padding:2px 6px;cursor:pointer}
#knobs .pre button:hover{border-color:#aaa}
#state{position:fixed;right:12px;bottom:14px;z-index:90;width:300px;background:rgba(10,10,10,.86);color:#ddd;border-radius:10px;font:11px/1.5 ui-monospace,monospace;padding:8px 10px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#state .k{color:#888}#state .log{color:#9fe0a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="desk">
  <div class="win" style="left:10px;right:calc(50% + 4px)"><div class="tb">kitty — ~/.config/quickshell</div><div class="blk" style="width:60%"></div><div class="blk" style="width:40%"></div></div>
  <div class="win active" style="left:calc(50% + 4px);right:10px"><div class="tb">Firefox</div><div class="blk" style="width:40%;height:22px"></div><div class="blk" style="width:86%"></div><div class="blk" style="width:78%"></div></div>
</div>
<div id="bar">
  <div class="wss" id="wss"></div>
  <div class="hair"></div>
  <div class="mod">Tue 13 Oct&nbsp;&nbsp;14:32</div>
  <div id="title" class="mod"></div>
  <div style="flex:1"></div>
  <div class="mod">▂▅▇▃▆▂</div><div class="mod">♪ 62%</div><div class="mod">⏻</div>
</div>

<div id="dash">
  <div class="dhead"><div class="tabs" id="tabs"></div><button class="gear">⚙</button></div>
  <div id="body"></div>
  <div id="grip" title="Drag to resize the card">⤡</div>
  <div id="sizeTag"></div>
</div>
<div id="toast" class="hide"></div>

<div id="switch">
  <button id="prev" title="Previous variant (←)">‹</button>
  <div class="lab" id="vlab"></div>
  <button id="next" title="Next variant (→)">›</button>
  <div class="div"></div>
  <select id="themeSel" title="Theme"></select>
</div>

<div id="knobs">
  <h4>CARD SIZE · not fixed</h4>
  <label><span>Width <b id="wv"></b></span><input type="range" id="kw" min="440" max="1400" step="10"></label>
  <label><span>Max height <b id="hv"></b></span><input type="range" id="kh" min="260" max="1000" step="10"></label>
  <label><span>Height</span><select id="khm"><option value="fit">Fit content, up to max</option><option value="fixed">Always max</option></select></label>
  <div class="pre">
    <button data-pre="480,420">Narrow</button><button data-pre="720,600">Today 720×600</button><button data-pre="1000,720">Wide</button><button data-pre="1280,860">Ultrawide</button><button data-pre="900,340">Short</button>
  </div>
  <h4>DATA</h4>
  <label><span>Monitors</span><select id="kmon"><option>1</option><option>2</option><option>3</option></select></label>
  <label><span>WS / monitor</span><select id="kws"></select></label>
  <label><span>Windows</span><select id="kden"><option value="light">Light</option><option value="normal">Normal</option><option value="heavy">Heavy</option></select></label>
</div>
<div id="state"><h4>PROTOTYPE STATE</h4><div id="stateB"></div></div>

<script>
// ---------------- palettes ----------------
const THEMES = {
  darknight:{mode:'dark',accent:'#b4befe',muted:'#9d93ad',background:'#141118',dark_background:'#27222f',lighter_background:'#282936',foreground:'#cac4d4',dark_foreground:'#4f455f',red:'#ff5252',magenta:'#a980db'},
  outpost:{mode:'dark',accent:'#d3ae78',muted:'#a1afa9',background:'#14282d',dark_background:'#102126',lighter_background:'#253c41',foreground:'#e8dfc4',red:'#d78f79',magenta:'#b5a0ba'},
  haven:{mode:'light',accent:'#795334',muted:'#526056',background:'#EEE8DA',dark_background:'#E7DFD0',lighter_background:'#E2DAC9',foreground:'#263D40',red:'#8C4036',magenta:'#6C4D6C'},
  vantablack:{mode:'dark',accent:'#8d8d8d',muted:'#7a7a7a',background:'#000000',dark_background:'#090909',lighter_background:'#1a1a1a',foreground:'#ffffff',red:'#a4a4a4',magenta:'#9b9b9b'},
};

// ---------------- fake Hyprland ----------------
const MONS = [{name:'DP-1',w:2560,h:1440},{name:'HDMI-A-1',w:1920,h:1080},{name:'eDP-1',w:1920,h:1200}];
const CATALOG = [
  {cls:'firefox',name:'Firefox',wt:5,titles:['Quickshell guide — Mozilla Firefox','chickenr1ce/darknight-qs · GitHub','Hyprland Wiki — Dispatchers','YouTube — lofi hip hop radio','Qt 6.11 — ListView QML Type']},
  {cls:'kitty',name:'kitty',wt:6,titles:['~/.config/quickshell','nvim windows/DashboardCenter.qml','btop','lazygit','~/fleet','yazi ~/Downloads']},
  {cls:'code',name:'Code',wt:2,titles:['DashboardCenter.qml — quickshell','README.md — fleet']},
  {cls:'spotify',name:'Spotify',wt:1,titles:['Spotify Premium']},
  {cls:'discord',name:'Discord',wt:2,titles:['#general — Hyprland','Friends — Discord']},
  {cls:'obsidian',name:'Obsidian',wt:1,titles:['2026-10-13 — vault — Obsidian']},
  {cls:'org.gnome.Nautilus',name:'Files',wt:1,titles:['Downloads','worktrees']},
  {cls:'steam',name:'Steam',wt:1,titles:['Steam','Friends List']},
  {cls:'thunderbird',name:'Thunderbird',wt:1,titles:['Inbox — alexiz — Thunderbird']},

let dragAddr = null;
$('#body').addEventListener('dragstart', e => { const d = e.target.closest('[data-drag]'); if (!d) return; dragAddr = d.dataset.drag; e.dataTransfer.setData('text/plain', dragAddr); e.dataTransfer.effectAllowed = 'move'; });
$('#body').addEventListener('dragover', e => { const t = e.target.closest('[data-drop]'); if (!t || !dragAddr) return; e.preventDefault(); document.querySelectorAll('.over').forEach(x => x !== t && x.classList.remove('over')); t.classList.add('over'); });
$('#body').addEventListener('dragleave', e => { const t = e.target.closest('[data-drop]'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('over'); });
$('#body').addEventListener('drop', e => { const t = e.target.closest('[data-drop]'); if (!t || !dragAddr) return; e.preventDefault(); A.move(dragAddr, +t.dataset.drop); dragAddr = null; mount(); });
$('#body').addEventListener('dragend', () => { dragAddr = null; document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });

document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); else if (e.key === 'ArrowRight') cycle(1);
});

mount();
new ResizeObserver(() => { sizeTag(); renderState(); }).observe($('#dash'));
</script>
</body>
</html>
