# Rendered by scripts/render-theme.sh from the active theme palette.
# Do not edit: the next palette load overwrites this file.
#
# starship has no include directive, so this repo owns the whole file. Edit
# the template at assets/templates/starship-theme.toml, not this copy. See
# docs/user/theme-desktop-setup.md.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$conda\
$python\
$time\n  \
[󱞪](fg:accent) \
"""

palette = "theme"

[palettes.theme]
accent = '{{accent}}'
red = '{{red}}'
yellow = '{{yellow}}'
magenta = '{{magenta}}'
blue = '{{blue}}'
cyan = '{{cyan}}'
selection = '{{selection}}'
selection_ink = '{{selection_ink}}'
text_accent = '{{text_accent}}'
text_red = '{{text_red}}'
text_yellow = '{{text_yellow}}'
text_magenta = '{{text_magenta}}'
text_blue = '{{text_blue}}'
text_cyan = '{{text_cyan}}'

[directory]
format = "[](fg:selection)[ $path ]($style)[](fg:selection) "
style = "bg:selection fg:text_blue"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[fill]
style = "fg:selection"
symbol = " "

[git_branch]
format = "[](fg:selection)[ $symbol $branch ]($style)[](fg:selection) "
style = "bg:selection fg:text_cyan"
symbol = ""

[git_status]
disabled = false
style = "bg:selection fg:text_red"
format = '[](fg:selection)([$all_status$ahead_behind]($style))[](fg:selection) '
up_to_date = '[ ✓ ](bg:selection fg:text_accent)'
untracked = '[?\($count\)](bg:selection fg:text_yellow)'
stashed = '[\$](bg:selection fg:text_accent)'
modified = '[!\($count\)](bg:selection fg:text_yellow)'
renamed = '[»\($count\)](bg:selection fg:text_accent)'
deleted = '[✘\($count\)](style)'
staged = '[++\($count\)](bg:selection fg:text_yellow)'
ahead = '[⇡\(${count}\)](bg:selection fg:text_cyan)'
diverged = '⇕[\[](bg:selection fg:text_accent)[⇡\(${ahead_count}\)](bg:selection fg:text_cyan)[⇣\(${behind_count}\)](bg:selection fg:text_magenta)[\]](bg:selection fg:text_accent)'
behind = '[⇣\(${count}\)](bg:selection fg:text_magenta)'

[time]
disabled = false
format = " [](fg:selection)[ $time 󰴈 ]($style)[](fg:selection)"
style = "bg:selection fg:text_magenta"
time_format = "%I:%M%P"
use_12hr = true

[username]
disabled = false
format = "[](fg:selection)[ 󰧱 $user ]($style)[](fg:selection) "
show_always = true
style_root = "bg:selection fg:text_accent"
style_user = "bg:selection fg:text_accent"

